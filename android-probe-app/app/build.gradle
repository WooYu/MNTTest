plugins {
    id "com.android.application"
}

android {
    namespace "com.mnatool.yunjutongprobe"
    compileSdk 34

    defaultConfig {
        applicationId "com.mnatool.yunjutongprobe"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
